name: Contribution Snake

# Generates the snake animation that eats the contribution graph and pushes the
# SVGs to the `output` branch, which README.md points at.

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Render the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Blue snake, yellow contribution dots — matches the README palette.
          outputs: |
            dist/snake.svg?color_snake=#4d9fff&color_dots=#ebedf0,#ffe9a8,#ffd75e,#ffc83d,#d9a400
            dist/snake-dark.svg?color_snake=#4d9fff&color_dots=#161b22,#3d3000,#6b5400,#c99a00,#ffc83d

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
