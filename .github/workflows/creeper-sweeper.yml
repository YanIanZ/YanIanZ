name: Creeper Sweeper

# Anyone can play by opening an issue titled with a command, e.g. `cs|reveal|3|4`.
# This workflow plays the move, re-renders the board into README.md, then closes the issue.

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Moves must not race each other — one board, one writer.
concurrency:
  group: creeper-sweeper
  cancel-in-progress: false

jobs:
  play:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'cs|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Play the move
        env:
          # Issue titles are untrusted input, so they only ever travel as an env var.
          CS_TITLE: ${{ github.event.issue.title || 'cs|render' }}
          CS_USER: ${{ github.event.issue.user.login || 'YanIanZ' }}
        run: |
          python game/creeper-sweeper/engine.py \
            --command "$CS_TITLE" \
            --user "$CS_USER" \
            --repo "$GITHUB_REPOSITORY" \
            --reply-file "$RUNNER_TEMP/reply.md" \
            --commit-file "$RUNNER_TEMP/commit.txt"

      - name: Commit the new board
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/creeper-sweeper/state.json
          if git diff --staged --quiet; then
            echo "Board unchanged, nothing to commit."
            exit 0
          fi
          git commit -F "$RUNNER_TEMP/commit.txt"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt), rebasing onto origin..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1

      - name: Reply and close the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/reply.md"
          gh issue close "$ISSUE" --reason completed
